# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - vernissage-api-dev

on:
  push:
    branches:
      - develop
      - release/*
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build backend/Vernissage.Api/Vernissage.Api.csproj --configuration Release -p:SourceBranch=${{ github.ref_name }}

      - name: dotnet publish
        run: dotnet publish backend/Vernissage.Api/Vernissage.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp" -p:SourceBranch=${{ github.ref_name }}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    environment: dev
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_19ABDA93FC1142439814C1EECAA63BF8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C285DC947FC94D1EB4061C1F1D9B2ACE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_98CCD31C9584421FB43CB7BFA60B43F7 }}

      - name: Configure App Service settings (idempotent; skips if secrets unset)
        shell: bash
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          settings=()
          if [ -n "${SQL_CONNECTION_STRING:-}" ]; then
            settings+=("ConnectionStrings__DefaultConnection=$SQL_CONNECTION_STRING")
          fi
          if [ -n "${JWT_SIGNING_KEY:-}" ]; then
            settings+=("Jwt__SigningKey=$JWT_SIGNING_KEY")
          fi
          if [ "${#settings[@]}" -eq 0 ]; then
            echo "No app-setting secrets provided; skipping app settings update."
            exit 0
          fi
          rg=$(az webapp list --query "[?name=='vernissage-api-dev'].resourceGroup | [0]" -o tsv)
          if [ -z "$rg" ]; then
            echo "Could not resolve resource group for vernissage-api-dev" >&2
            exit 1
          fi
          az webapp config appsettings set --name vernissage-api-dev --resource-group "$rg" --settings "${settings[@]}" --output none
          echo "Applied ${#settings[@]} app setting(s) to vernissage-api-dev."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vernissage-api-dev'
          slot-name: 'Production'
          package: .
          